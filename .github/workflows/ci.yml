# CI (TDD 4.5): dieselben Prüfungen wie lokal vor jedem Commit, plus E2E gegen das gebaute Artefakt.
# Ein Push auf `production` deployt zusätzlich nach GitHub Pages, aber nur nach grünem `check` (TAK-14, D-21).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Auf `main` und `production` nicht abbrechen, damit kein Deployment unterbrochen wird.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/production' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Formatprüfung
        run: npm run format:check

      - name: Typprüfung
        run: npm run typecheck

      - name: Unit-Tests
        run: npm test

      - name: Build mit Prüfung der Ausgabe
        run: npm run build

      # Nicht gecacht: Wiederherstellen dauert so lange wie der Download, Systempakete sind nicht cachebar.
      - name: Browser für E2E installieren
        run: npx playwright install --with-deps chromium webkit

      - name: E2E-Tests (Chromium, WebKit)
        run: npm run test:e2e

      - name: Playwright-Report hochladen
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      # Nach den E2E-Tests: Playwright baut selbst neu, ausgeliefert wird genau das getestete dist/.
      - name: Build für GitHub Pages bereitstellen
        if: github.event_name == 'push' && github.ref == 'refs/heads/production'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # `production` entsteht nur per Fast-Forward aus `main` (D-21): Der Commit muss in `main` enthalten sein.
      - name: Stand von production in main prüfen
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - id: deployment
        uses: actions/deploy-pages@v5
