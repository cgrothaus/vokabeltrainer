# CI (TDD 4.5): dieselben Prüfungen wie lokal vor jedem Commit, plus E2E gegen das gebaute Artefakt.
# Ein Push auf `production` deployt zusätzlich nach GitHub Pages, aber nur nach grünem `check` und `e2e` (TAK-14, D-21).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Auf `main` und `production` nicht abbrechen, damit kein Deployment unterbrochen wird.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/production' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Formatprüfung
        run: npm run format:check

      - name: Typprüfung
        run: npm run typecheck

      - name: Unit-Tests
        run: npm test

      - name: Build mit Prüfung der Ausgabe
        run: npm run build

  # E2E je Browser in einem eigenen Job: halbiert die Laufzeit, jeder Job hat sein eigenes Zeitlimit (TDD 4.5).
  e2e:
    name: e2e (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: mobile-chromium
            browser: chromium
          - project: mobile-webkit
            browser: webkit
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      # Nicht gecacht: Wiederherstellen dauert so lange wie der Download, Systempakete sind nicht cachebar.
      # Der Download hing schon über 10 Minuten (normal: unter einer): je Versuch 4 Minuten, bis zu drei Versuche.
      - name: Browser für E2E installieren
        timeout-minutes: 15
        run: |
          for attempt in 1 2 3; do
            timeout 4m npx playwright install --with-deps ${{ matrix.browser }} && exit 0
            echo "Installation gescheitert (Versuch $attempt von 3)"
          done
          exit 1

      - name: E2E-Tests (${{ matrix.browser }})
        run: npm run test:e2e -- --project=${{ matrix.project }}

      - name: Playwright-Report hochladen
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14

      # Nach den E2E-Tests: Playwright baut selbst neu, ausgeliefert wird genau das getestete dist/.
      # Der Build ist in beiden Jobs gleich, hochgeladen wird er nur einmal.
      - name: Build für GitHub Pages bereitstellen
        if: matrix.project == 'mobile-chromium' && github.event_name == 'push' && github.ref == 'refs/heads/production'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  deploy:
    needs: [check, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # `production` entsteht nur per Fast-Forward aus `main` (D-21): Der Commit muss in `main` enthalten sein.
      - name: Stand von production in main prüfen
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - id: deployment
        uses: actions/deploy-pages@v5
